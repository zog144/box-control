[build-system]
requires = ["setuptools>=80,<83"]
build-backend = "setuptools.build_meta"

# Component-development metadata only. Public Python publication is the
# aggregate "zog" distribution assembled by release-build.
[project]
name = "box-control"
version = "0.1.0"
description = "Filesystem-driven Linux application reconciliation control plane"
requires-python = ">=3.11"
dependencies = ["image-build==0.2.0.dev5", "dbus-next==0.2.3"]
license = "BSD-3-Clause OR GPL-3.0-only"
license-files = ["LICENSE", "LICENSES/*.txt", "THIRD-PARTY-NOTICES.md"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
box-control = "zog.box_control.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["zog.box_control*"]
namespaces = true
