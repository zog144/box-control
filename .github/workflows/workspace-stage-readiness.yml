name: Workspace stage diagnostic projection — source only
on:
  push:
    branches: [regular/workspace-independent-readiness-20261102]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controller-evidence:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          python -m pip install 'pytest>=8,<10' 'dbus-next==0.2.3'
          cd box-control
          python -m compileall -q src/zog/box_control/api.py tests/test_workspace_readiness_evidence.py
          PYTHONPATH=src python -m pytest -q -rs tests/test_workspace_readiness_evidence.py tests/test_workspaces.py
      - name: No native Workspace or station acceptance
        if: always()
        run: echo 'Source-only controller mock transport; no real X11/RFB launch and no browser grant.' >> "$GITHUB_STEP_SUMMARY"
