name: Public source validation

on:
  push:
    branches: [main, unstable]
  pull_request:
    branches: [main, unstable]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-aggregate-compatibility:
    name: current-companion-source-compatibility (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/box-control/src:${{ github.workspace }}/companions/root-control/src:${{ github.workspace }}/.ci-deps
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact reviewed root-control companion
        uses: actions/checkout@v4
        with:
          repository: zog144/root-control
          ref: 8a9583924109ef324eb80071953151c8c7e20b33
          path: companions/root-control
          persist-credentials: false
      - name: Check out immutable public Zog aggregate for companions
        uses: actions/checkout@v4
        with:
          repository: zog144/zog
          ref: d47d86b363824c718d9c165124cb55bbed12e0f9
          path: companions/zog
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check public source boundary
        run: |
          test ! -e COPYRIGHT
          test ! -e version-share-handoff.json
          test ! -e .github/workflows/cross-repo-pytest.yml
          test -f LICENSE
          test -f LICENSES/BSD-3-Clause.txt
          test -f LICENSES/GPL-3.0-only.txt
      - name: Validate exact current privileged companion and historical support fixture
        run: |
          test "$(git -C companions/root-control rev-parse HEAD)" = "8a9583924109ef324eb80071953151c8c7e20b33"
          test "$(git -C companions/zog rev-parse HEAD)" = "d47d86b363824c718d9c165124cb55bbed12e0f9"
          test -f companions/root-control/src/zog/root_control/daemon.py
          test -f companions/zog/src/zog/image_build/__init__.py
          {
            echo "## Public controller source and required identity cases"
            echo "- Candidate controller: $(git rev-parse HEAD)"
            echo "- Exact root-control: $(git -C companions/root-control rev-parse HEAD)"
            echo "- Historical Zog: support modules only, not accepted current image-build"
            echo "- No live systemd, host socket DAC, reboot or compiler UID acceptance"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Construct isolated historical support namespace
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path("companions/zog/src/zog").resolve()
          dst = Path(".ci-deps/zog")
          dst.mkdir(parents=True, exist_ok=True)
          for item in src.iterdir():
              if item.name in {"__init__.py", "__pycache__", "root_control", "box_control"}:
                  continue
              if item.is_dir() or (item.is_file() and item.suffix == ".py"):
                  (dst / item.name).symlink_to(item)
          assert not (dst / "__init__.py").exists()
          assert not (dst / "root_control").exists()
          assert not (dst / "box_control").exists()
          PY
      - name: Install component and tooling
        run: |
          python -m pip install 'dbus-next==0.2.3' 'pytest>=8,<10'
          python -m pip install --no-deps -e ./box-control -e ./companions/root-control
      - name: Compile current sources, tests and reviewed acceptance scripts
        run: python -m compileall -q box-control/src companions/root-control/src box-control/tests acceptance
      - name: Ensure installed namespace binds current companions, not historical copies
        run: |
          python - <<'PY'
          from pathlib import Path
          import zog.box_control, zog.root_control, zog.image_build
          root = Path.cwd()
          assert Path(zog.box_control.__file__).resolve().is_relative_to(root / "box-control/src")
          assert Path(zog.root_control.__file__).resolve().is_relative_to(root / "companions/root-control/src")
          assert Path(zog.image_build.__file__).resolve().is_relative_to(root / "companions/zog/src")
          PY
      - name: Run current-companion compatibility without identity deselections
        run: |
          python -m pytest -q -ra --strict-markers --junitxml=identity-compat-results.xml \
            box-control/tests/test_namespace_migration.py \
            box-control/tests/test_dependency.py \
            box-control/tests/test_specification.py \
            box-control/tests/test_generation.py \
            box-control/tests/test_locking.py \
            box-control/tests/test_durability.py \
            box-control/tests/test_host_gateway.py \
            box-control/tests/test_retention.py \
            box-control/tests/test_launch_cancellation.py
      - name: Require all four symbolic identity cases and zero skips
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          source = Path("identity-compat-results.xml")
          if not source.is_file():
              raise SystemExit("current-companion identity test results are missing")
          xml = ET.parse(source)
          cases = list(xml.iter("testcase"))
          names = [
              "test_symbolic_persistent_execution_identity_requires_no_explicit_user",
              "test_symbolic_grant_rejects_caller_chosen_credentials",
              "test_symbolic_identity_rejects_nonpersistent_or_multi_instance",
          ]
          hits = [sum(name in case.get("name", "") for case in cases) for name in names]
          failures = sum(case.find("failure") is not None or case.find("error") is not None for case in cases)
          skips = sum(case.find("skipped") is not None for case in cases)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"\\nIdentity compatibility: {len(cases)} executed; identity function cases {hits}; failures {failures}; skips {skips}; no deselection argument.\\n")
              summary.write("Historical Zog support is not a current native image-build or systemd gate.\\n")
          if hits != [1, 2, 1] or skips or failures:
              raise SystemExit("required identity cases absent, failed or skipped")
          PY
      - name: Check canonical import
        run: python -c 'import zog.box_control as b; assert b.__version__ == "0.1.0"'

  package-artifacts:
    name: Wheel and source-distribution audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build nested Python project
        run: |
          python -m pip install build
          python -m build ./box-control --outdir dist
      - name: Inspect public package boundaries
        run: |
          python - <<'PY'
          import glob, tarfile, zipfile
          wheels=glob.glob('dist/*.whl')
          sdists=glob.glob('dist/*.tar.gz')
          assert len(wheels)==len(sdists)==1
          with zipfile.ZipFile(wheels[0]) as archive:
              files=set(archive.namelist())
              assert 'zog/box_control/__init__.py' in files
              assert 'zog/box_control/api.py' in files
              assert 'zog/__init__.py' not in files
              assert not any(x.startswith('zog/root_control/') for x in files)
              assert any(x.endswith('/LICENSE') for x in files)
              ep=next(x for x in files if x.endswith('.dist-info/entry_points.txt'))
              assert 'box-control = zog.box_control.cli:main' in archive.read(ep).decode()
          with tarfile.open(sdists[0], 'r:gz') as archive:
              names=archive.getnames()
              prefix=names[0].split('/',1)[0]
              files={x[len(prefix)+1:] for x in names if x.startswith(prefix+'/')}
              for path in ('LICENSE','LICENSES/BSD-3-Clause.txt',
                           'LICENSES/GPL-3.0-only.txt','THIRD-PARTY-NOTICES.md',
                           'README.md','src/zog/box_control/api.py'):
                  assert path in files,path
              assert 'COPYRIGHT' not in files
              assert 'version-share-handoff.json' not in files
          PY
