name: Certificate controller integration

on:
  push:
    branches: [unstable]
    paths:
      - 'box-control/src/zog/box_control/application_storage.py'
      - 'box-control/src/zog/box_control/host_bindings.py'
      - 'box-control/tests/test_certify_policy_binding.py'
      - 'box-control/tests/test_issuer_observer.py'
      - 'box-control/tests/test_issuer_lifecycle_broker.py'
      - 'box-control/src/zog/box_control/issuer_lifecycle_broker.py'
      - 'box-control/src/zog/box_control/issuer_lifecycle_client.py'
      - 'box-control/src/zog/box_control/issuer_observer.py'
      - 'box-control/src/zog/box_control/issuer_observer_client.py'
      - 'box-control/src/zog/box_control/runtime/root_control.py'
      - 'box-control/src/zog/box_control/api.py'
      - 'box-control/tests/test_certify_application_profile.py'
      - 'box-control/tests/test_selected_program_execution.py'
      - 'box-control/tests/test_selected_program_recovery.py'
      - 'box-control/src/zog/box_control/reconcile.py'
      - 'box-control/src/zog/box_control/requests.py'
      - 'box-control/src/zog/box_control/operations.py'
      - 'box-control/src/zog/box_control/runtime/systemd.py'
      - 'box-control/src/zog/box_control/model.py'
      - 'box-control/src/zog/box_control/specification.py'
      - 'box-control/tests/test_execution_identity.py'
      - '.github/workflows/certificate-controller-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certificate-policy-and-private-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/companions/zog/src
    steps:
      - uses: actions/checkout@v4
      - name: Check out exact root-control security companion
        uses: actions/checkout@v4
        with:
          repository: zog144/root-control
          ref: 94eb2585e9d0286880517a4ceae4df717e3c3a4a
          path: root-control
      - name: Check out known compatible public image-build source
        uses: actions/checkout@v4
        with:
          repository: zog144/zog
          ref: d47d86b363824c718d9c165124cb55bbed12e0f9
          path: companions/zog
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify immutable companion checkout pins
        run: |
          test "$(git -C root-control rev-parse HEAD)" = "94eb2585e9d0286880517a4ceae4df717e3c3a4a"
          test "$(git -C companions/zog rev-parse HEAD)" = "d47d86b363824c718d9c165124cb55bbed12e0f9"
      - name: Install test dependencies
        run: python -m pip install 'pytest>=8,<10' 'dbus-next==0.2.3'
      - name: Overlay exact component source onto frozen namespace fixture
        run: |
          # The public aggregate currently contains a regular zog package and
          # would otherwise shadow the separately checked-out namespace
          # components. Overlay them in the disposable CI workspace only.
          cp -a box-control/src/zog/box_control/. companions/zog/src/zog/box_control/
          cp -a root-control/src/zog/root_control/. companions/zog/src/zog/root_control/
          python -c 'import zog.box_control.host_bindings, zog.root_control.systemd'
      - name: Compile both controller sources
        run: python -m compileall -q box-control/src root-control/src
      - name: Test certificate authority binding and managed storage privacy
        run: |
          python -m pytest -q \
            box-control/tests/test_certify_policy_binding.py \
            box-control/tests/test_issuer_observer.py \
            box-control/tests/test_issuer_lifecycle_broker.py \
            box-control/tests/test_certify_application_profile.py \
            box-control/tests/test_selected_program_execution.py \
            box-control/tests/test_selected_program_recovery.py \
            box-control/tests/test_host_bindings.py \
            box-control/tests/test_execution_identity.py \
            root-control/tests/test_certificate_policy_binding.py \
            root-control/tests/test_private_persistent_storage.py \
            root-control/tests/test_selected_program_authority.py \
            root-control/tests/test_issuer_observation.py \
            root-control/tests/test_issuer_credentials.py
