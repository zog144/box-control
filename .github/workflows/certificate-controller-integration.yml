name: Certificate controller integration

on:
  pull_request:
    branches: [main, unstable]
  push:
    branches: [unstable, regular/issuer-broker-revocation-admission-20261101, regular/issuer-and-inherited-build-20261114]
    paths:
      - 'box-control/src/zog/box_control/application_storage.py'
      - 'box-control/src/zog/box_control/host_bindings.py'
      - 'box-control/tests/test_certify_policy_binding.py'
      - 'box-control/tests/test_issuer_observer.py'
      - 'box-control/tests/test_issuer_lifecycle_broker.py'
      - 'box-control/src/zog/box_control/issuer_lifecycle_broker.py'
      - 'box-control/src/zog/box_control/issuer_broker_authority.py'
      - 'box-control/tests/test_issuer_broker_revocation_admission.py'
      - 'box-control/src/zog/box_control/issuer_lifecycle_client.py'
      - 'box-control/src/zog/box_control/issuer_observer.py'
      - 'box-control/src/zog/box_control/issuer_observer_client.py'
      - 'box-control/src/zog/box_control/runtime/root_control.py'
      - 'box-control/src/zog/box_control/api.py'
      - 'box-control/tests/test_certify_application_profile.py'
      - 'box-control/tests/test_selected_program_execution.py'
      - 'box-control/tests/test_selected_program_recovery.py'
      - 'box-control/src/zog/box_control/reconcile.py'
      - 'box-control/src/zog/box_control/requests.py'
      - 'box-control/src/zog/box_control/operations.py'
      - 'box-control/src/zog/box_control/runtime/systemd.py'
      - 'box-control/src/zog/box_control/model.py'
      - 'box-control/src/zog/box_control/specification.py'
      - 'box-control/tests/test_execution_identity.py'
      - 'box-control/src/zog/box_control/build_protocol.py'
      - 'box-control/tests/test_build_jobs.py'
      - '.github/workflows/certificate-controller-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certificate-policy-and-private-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/companions/zog/src
    steps:
      - uses: actions/checkout@v4
      - name: Check out exact root-control security companion
        uses: actions/checkout@v4
        with:
          repository: zog144/root-control
          ref: d9dfd6c02a5a96750f1213bf663cdceab72f1efd
          path: root-control
      - name: Check out exact selected host-deploy candidate for a source-only admission race
        uses: actions/checkout@v4
        with:
          repository: zog144/host-deploy
          ref: b4e723abab3dadcf238b0552ee4d5f108e6a6d95
          path: host-deploy
          persist-credentials: false
      - name: Check out known compatible public image-build source
        uses: actions/checkout@v4
        with:
          repository: zog144/zog
          ref: d47d86b363824c718d9c165124cb55bbed12e0f9
          path: companions/zog
      - name: Select exact inherited-user image-build producer (not a second root-control)
        uses: actions/checkout@v4
        with:
          repository: zog144/image-build
          ref: 620378bdd8075daeb5eaad45eedea4af7db36423
          path: companions/image-build-inherited
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify immutable companion checkout pins
        run: |
          test "$(git -C root-control rev-parse HEAD)" = "d9dfd6c02a5a96750f1213bf663cdceab72f1efd"
          test "$(git -C host-deploy rev-parse HEAD)" = "b4e723abab3dadcf238b0552ee4d5f108e6a6d95"
          test "$(git -C companions/zog rev-parse HEAD)" = "d47d86b363824c718d9c165124cb55bbed12e0f9"
          test "$(git -C companions/image-build-inherited rev-parse HEAD)" = "620378bdd8075daeb5eaad45eedea4af7db36423"
      - name: Install test dependencies
        run: python -m pip install 'pytest>=8,<10' 'dbus-next==0.2.3'
      - name: Overlay exact component source onto frozen namespace fixture
        run: |
          # The public aggregate currently contains a regular zog package and
          # would otherwise shadow the separately checked-out namespace
          # components. Overlay them in the disposable CI workspace only.
          cp -a box-control/src/zog/box_control/. companions/zog/src/zog/box_control/
          cp -a root-control/src/zog/root_control/. companions/zog/src/zog/root_control/
          cp -a companions/image-build-inherited/src/zog/image_build/. companions/zog/src/zog/image_build/
          python -c 'import zog.box_control.host_bindings, zog.root_control.systemd, zog.image_build.box_control_adapter'
          python - <<'PY'
          from zog.root_control.task_c_trusted_host import LocalTaskCJournal
          from zog.root_control.issuer_observation import observe_issuer_request
          from zog.root_control.issuer_inspection_result import read_selected_inspection
          from zog.root_control.build import BuildBackend
          from zog.box_control.issuer_lifecycle_broker import IssuerLifecycleBroker
          assert callable(LocalTaskCJournal.submit_once)
          assert callable(observe_issuer_request) and callable(read_selected_inspection)
          assert callable(BuildBackend.start) and callable(IssuerLifecycleBroker)
          PY
      - name: Compile both controller sources
        run: python -m compileall -q box-control/src root-control/src
      - name: Test certificate authority binding and managed storage privacy
        run: |
          python -m pytest -q \
            box-control/tests/test_certify_policy_binding.py \
            box-control/tests/test_issuer_observer.py \
            box-control/tests/test_issuer_lifecycle_broker.py \
            box-control/tests/test_issuer_broker_revocation_admission.py \
            box-control/tests/test_certify_application_profile.py \
            box-control/tests/test_selected_program_execution.py \
            box-control/tests/test_selected_program_recovery.py \
            box-control/tests/test_host_bindings.py \
            box-control/tests/test_execution_identity.py \
            root-control/tests/test_certificate_policy_binding.py \
            root-control/tests/test_private_persistent_storage.py \
            root-control/tests/test_selected_program_authority.py \
            root-control/tests/test_issuer_observation.py \
            root-control/tests/test_issuer_credentials.py \
            root-control/tests/test_issuer_station_transfer.py \
            root-control/tests/test_issuer_inspection_result.py \
            root-control/tests/test_issuer_systemd_fence.py \
            root-control/tests/test_combined_issuer_taskc_build.py \
            root-control/tests/test_build_backend.py \
            box-control/tests/test_build_jobs.py

      - name: Root-owned ephemeral authority and revocation race check (no native Host)
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          sudo -E env PYTHONPATH="$PWD/companions/zog/src" "$(command -v python)" \
            -m pytest -q -rs \
            box-control/tests/test_issuer_broker_revocation_admission.py \
            -k test_root_file_revocation_pending_tampering_and_read_race
      - name: Overlay exact pinned host-deploy selected controller into isolated namespace
        run: |
          mkdir -p companions/zog/src/zog/host_deploy
          cp -a host-deploy/src/zog/host_deploy/. companions/zog/src/zog/host_deploy/
          cmp host-deploy/src/zog/host_deploy/certificate_issuer_lifecycle.py \
              companions/zog/src/zog/host_deploy/certificate_issuer_lifecycle.py
          python - <<'PY'
          import zog.box_control.issuer_lifecycle_broker
          import zog.host_deploy.certificate_issuer_lifecycle
          PY
      - name: 'Cross-owner checked heads - client verification then server revocation'
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          PYTHONPATH="$PWD/box-control/tests:$PWD/companions/zog/src" \
            python -m pytest -q -ra \
            box-control/tests/issuer_broker_cross_owner_candidate.py

